<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>動画・音声 オールインワン編集＆最適化ツール</title>
  <!-- FFmpeg.wasm (v0.11.x Stable) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #007aff;
      --accent-hover: #0056b3;
      --text-color: #ffffff;
      --sub-text: #aaaaaa;
      --border-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .file-input-wrapper {
      margin-bottom: 20px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-btn {
      background: #2a2a2a;
      border: 1px dashed var(--accent-color);
      color: var(--accent-color);
      padding: 16px 24px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      font-weight: bold;
      transition: background 0.2s;
    }

    .custom-file-btn:hover {
      background: #333333;
    }

    .preview-section {
      display: none;
      margin-bottom: 20px;
    }

    video, audio {
      width: 100%;
      max-height: 360px;
      background: #000;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .controls-group {
      background: #262626;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .range-group {
      margin-bottom: 12px;
    }

    .range-group:last-child {
      margin-bottom: 0;
    }

    .label-time {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--sub-text);
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-item label {
      font-size: 12px;
      color: var(--sub-text);
    }

    select, input[type="number"] {
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      background: #444;
      cursor: not-allowed;
    }

    .progress-container {
      display: none;
      margin-top: 16px;
    }

    .progress-bar-bg {
      background: #2a2a2a;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar-fill {
      background: var(--accent-color);
      height: 100%;
      width: 0%;
      transition: width 0.1s;
    }

    .status-text {
      font-size: 12px;
      color: var(--sub-text);
      text-align: center;
    }

    .result-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .download-btn {
      background: #34c759;
      display: inline-block;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }

    .download-btn:hover {
      background: #28a745;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>メディア編集・トリミング＆軽量化コンバーター</h1>

  <!-- 1. ファイル選択 -->
  <div class="file-input-wrapper">
    <label class="custom-file-btn" for="fileInput" id="fileBtnLabel">
      動画 / 音声ファイルを選択 (MP4, MP3, MOV, WebM等)
    </label>
    <input type="file" id="fileInput" accept="video/*,audio/*">
  </div>

  <!-- 2. プレビュー＆トリミング調整 -->
  <div class="preview-section" id="previewSection">
    <video id="videoPreview" controls></video>

    <div class="controls-group">
      <div class="range-group">
        <div class="label-time">
          <span>開始位置 (Start)</span>
          <span id="startTimeLabel">00:00.0</span>
        </div>
        <input type="range" id="startRange" min="0" value="0" step="0.1">
      </div>

      <div class="range-group">
        <div class="label-time">
          <span>終了位置 (End)</span>
          <span id="endTimeLabel">00:00.0</span>
        </div>
        <input type="range" id="endRange" min="0" value="0" step="0.1">
      </div>
    </div>

    <div class="info-bar">
      <span>選択された長さ: <strong id="selectedDurationLabel">00:00.0</strong></span>
      <button type="button" id="playCutBtn" style="background:#3a3a3c; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">
        選択範囲を再生
      </button>
    </div>

    <!-- 3. 出力フォーマット＆サイズ自動最適化の設定 -->
    <div class="options-grid">
      <div class="option-item">
        <label for="formatSelect">変換出力フォーマット</label>
        <select id="formatSelect">
          <option value="mp4">MP4 (動画)</option>
          <option value="mp3">MP3 (音声のみ抽出)</option>
        </select>
      </div>

      <div class="option-item">
        <label for="targetSizeInput">目標上限ファイルサイズ (KB)</label>
        <input type="number" id="targetSizeInput" value="800" min="100" step="50">
      </div>
    </div>

    <button id="processBtn" class="btn">最適化して変換処理を実行</button>

    <!-- プログレス表示 -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText">FFmpegを準備中...</div>
    </div>

    <!-- 結果ダウンロード -->
    <div class="result-section" id="resultSection">
      <h3>変換が完了しました！</h3>
      <p id="resultInfoText"></p>
      <a id="downloadLink" class="download-btn" download>ファイルをダウンロード</a>
    </div>
  </div>
</div>

<script>
  const { createFFmpeg, fetchFile } = FFmpeg;
  const ffmpeg = createFFmpeg({ log: false });

  // DOM要素
  const fileInput = document.getElementById('fileInput');
  const previewSection = document.getElementById('previewSection');
  const videoPreview = document.getElementById('videoPreview');
  const startRange = document.getElementById('startRange');
  const endRange = document.getElementById('endRange');
  const startTimeLabel = document.getElementById('startTimeLabel');
  const endTimeLabel = document.getElementById('endTimeLabel');
  const selectedDurationLabel = document.getElementById('selectedDurationLabel');
  const playCutBtn = document.getElementById('playCutBtn');
  const formatSelect = document.getElementById('formatSelect');
  const targetSizeInput = document.getElementById('targetSizeInput');
  const processBtn = document.getElementById('processBtn');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');
  const resultSection = document.getElementById('resultSection');
  const resultInfoText = document.getElementById('resultInfoText');
  const downloadLink = document.getElementById('downloadLink');

  let currentFile = null;
  let totalDuration = 0;
  let startTime = 0;
  let endTime = 0;

  // 秒数フォーマット (mm:ss.s)
  function formatTime(sec) {
    const mins = Math.floor(sec / 60);
    const secs = (sec % 60).toFixed(1);
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  // ファイル選択時
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    currentFile = file;
    const url = URL.createObjectURL(file);
    videoPreview.src = url;
    previewSection.style.display = 'block';
    resultSection.style.display = 'none';
  });

  // メタデータ読み込み完了時のシーク＆スライダー初期化
  videoPreview.addEventListener('loadedmetadata', () => {
    totalDuration = videoPreview.duration;
    
    startRange.max = totalDuration;
    endRange.max = totalDuration;
    
    startRange.value = 0;
    endRange.value = totalDuration;

    updateUI();
  });

  // トリミング調整UIの更新
  function updateUI() {
    startTime = parseFloat(startRange.value);
    endTime = parseFloat(endRange.value);

    // 開始が終了を超えないよう調整
    if (startTime >= endTime) {
      startTime = Math.max(0, endTime - 0.1);
      startRange.value = startTime;
    }

    startTimeLabel.textContent = formatTime(startTime);
    endTimeLabel.textContent = formatTime(endTime);
    selectedDurationLabel.textContent = formatTime(endTime - startTime);
  }

  startRange.addEventListener('input', () => {
    updateUI();
    videoPreview.currentTime = startTime;
  });

  endRange.addEventListener('input', () => {
    updateUI();
    videoPreview.currentTime = endTime;
  });

  // 範囲プレビュー再生
  playCutBtn.addEventListener('click', () => {
    videoPreview.currentTime = startTime;
    videoPreview.play();
  });

  videoPreview.addEventListener('timeupdate', () => {
    if (videoPreview.currentTime >= endTime) {
      videoPreview.pause();
      videoPreview.currentTime = startTime;
    }
  });

  // 変換・カット・ファイルサイズ最適化の実行
  processBtn.addEventListener('click', async () => {
    if (!currentFile) return;

    const duration = endTime - startTime;
    if (duration <= 0) {
      alert('有効なカット時間を指定してください。');
      return;
    }

    const targetSizeKB = parseFloat(targetSizeInput.value) || 800;
    const targetFormat = formatSelect.value;

    // UIを処理中状態にする
    processBtn.disabled = true;
    progressContainer.style.display = 'block';
    resultSection.style.display = 'none';
    progressBar.style.width = '0%';
    statusText.textContent = 'FFmpegエンジンを起動中...';

    try {
      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }

      // FFmpeg進捗イベント
      ffmpeg.setProgress(({ ratio }) => {
        const percent = Math.min(Math.round(ratio * 100), 100);
        if (!isNaN(percent)) {
          progressBar.style.width = percent + '%';
          statusText.textContent = `処理中... ${percent}%`;
        }
      });

      // 仮想ファイルシステムに書き込み
      const inputName = `input_${Date.now()}.${currentFile.name.split('.').pop()}`;
      const outputName = `output_${Date.now()}.${targetFormat}`;
      ffmpeg.FS('writeFile', inputName, await fetchFile(currentFile));

      // 最短サイズ達成のための目標ビットレート算出 (bps)
      // Bitrate = (Target Size in Bits) / Duration
      const targetBits = targetSizeKB * 1024 * 8;
      const totalTargetBitrateKbps = Math.floor((targetBits / duration) / 1024);

      let ffmpegArgs = [];

      // 時間カット用オプション
      ffmpegArgs.push('-ss', startTime.toString());
      ffmpegArgs.push('-i', inputName);
      ffmpegArgs.push('-t', duration.toString());

      if (targetFormat === 'mp3') {
        // MP3最適化：指定サイズに収めるための音声ビットレート制限
        // 音声は最低32kbps程度必要
        const audioBitrate = Math.max(32, Math.min(320, totalTargetBitrateKbps));
        ffmpegArgs.push('-b:a', `${audioBitrate}k`);
      } else if (targetFormat === 'mp4') {
        // MP4最適化：映像＋音声のビットレート配分
        // 音声を64kbpsに固定し、残りを映像へ割り振り
        const audioBitrate = 64;
        let videoBitrate = totalTargetBitrateKbps - audioBitrate;

        // 動画が壊れない最小ビットレート設定
        if (videoBitrate < 50) videoBitrate = 50;

        ffmpegArgs.push('-c:v', 'libx264');
        ffmpegArgs.push('-b:v', `${videoBitrate}k`);
        ffmpegArgs.push('-maxrate', `${videoBitrate * 1.2}k`);
        ffmpegArgs.push('-bufsize', `${videoBitrate * 2}k`);
        ffmpegArgs.push('-vf', 'scale=-2:min(480\\,ih)'); // 短時間＆小サイズ化のため最大480pに解像度調整
        ffmpegArgs.push('-c:a', 'aac');
        ffmpegArgs.push('-b:a', `${audioBitrate}k`);
        ffmpegArgs.push('-preset', 'ultrafast'); // 最短時間処理
      }

      ffmpegArgs.push(outputName);

      statusText.textContent = '変換およびサイズ最適化エンコードを実行中...';
      await ffmpeg.run(...ffmpegArgs);

      // 結果取り出し
      const data = ffmpeg.FS('readFile', outputName);
      const blob = new Blob([data.buffer], { type: targetFormat === 'mp3' ? 'audio/mp3' : 'video/mp4' });
      const actualSizeKB = (blob.size / 1024).toFixed(1);

      // クリーニング
      ffmpeg.FS('unlink', inputName);
      ffmpeg.FS('unlink', outputName);

      // 完了UI更新
      const downloadUrl = URL.createObjectURL(blob);
      downloadLink.href = downloadUrl;
      downloadLink.download = `optimized_cut.${targetFormat}`;
      
      resultInfoText.textContent = `出力サイズ: ${actualSizeKB} KB / 再生時間: ${duration.toFixed(1)} 秒`;
      resultSection.style.display = 'block';
      statusText.textContent = '完了しました！';

    } catch (err) {
      console.error(err);
      alert('処理中にエラーが発生しました。ファイルフォーマットまたはカット設定を確認してください。');
      statusText.textContent = 'エラーが発生しました。';
    } finally {
      processBtn.disabled = false;
    }
  });
</script>

</body>
</html>
