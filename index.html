  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mp3/mp4変換</title>
  <!-- FFmpeg.wasm (v0.11.x Stable) -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #007aff;
      --accent-hover: #0056b3;
      --text-color: #ffffff;
      --sub-text: #aaaaaa;
      --border-color: #333333;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      max-width: 800px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 20px;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .file-input-wrapper {
      margin-bottom: 20px;
      text-align: center;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-btn {
      background: #2a2a2a;
      border: 1px dashed var(--accent-color);
      color: var(--accent-color);
      padding: 16px 24px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-block;
      font-weight: bold;
      transition: background 0.2s;
    }

    .custom-file-btn:hover {
      background: #333333;
    }

    .preview-section {
      display: none;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      max-height: 360px;
      background: #000;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .controls-group {
      background: #262626;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .range-group {
      margin-bottom: 12px;
    }

    .range-group:last-child {
      margin-bottom: 0;
    }

    .label-time {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: var(--sub-text);
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1a1a;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .option-item label {
      font-size: 12px;
      color: var(--sub-text);
    }

    select, input[type="number"] {
      background: #2a2a2a;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      background: #444;
      cursor: not-allowed;
    }

    .progress-container {
      display: none;
      margin-top: 16px;
    }

    .progress-bar-bg {
      background: #2a2a2a;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-bar-fill {
      background: var(--accent-color);
      height: 100%;
      width: 0%;
      transition: width 0.1s;
    }

    .status-text {
      font-size: 12px;
      color: var(--sub-text);
      text-align: center;
    }

    .result-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .download-btn {
      background: #34c759;
      display: inline-block;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }

    .download-btn:hover {
      background: #28a745;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>画面録画・動画/音声コンバーター（CapCut風調整付き）</h1>

  <!-- 1. ファイル選択 -->
  <div class="file-input-wrapper">
    <label class="custom-file-btn" for="fileInput" id="fileBtnLabel">
      画面録画や動画・音声を選択 (MP4, MOV, WebM, MP3等)
    </label>
    <input type="file" id="fileInput" accept="video/*,audio/*,.mov,.mp4,.webm,.m4a">
  </div>

  <!-- 2. プレビュー＆トリミング調整 -->
  <div class="preview-section" id="previewSection">
    <video id="videoPreview" controls playsinline></video>

    <div class="controls-group">
      <div class="range-group">
        <div class="label-time">
          <span>開始位置 (Start)</span>
          <span id="startTimeLabel">00:00.0</span>
        </div>
        <input type="range" id="startRange" min="0" value="0" step="0.1">
      </div>

      <div class="range-group">
        <div class="label-time">
          <span>終了位置 (End)</span>
          <span id="endTimeLabel">00:00.0</span>
        </div>
        <input type="range" id="endRange" min="0" value="0" step="0.1">
      </div>
    </div>

    <div class="info-bar">
      <span>カット後の再生時間: <strong id="selectedDurationLabel">00:00.0</strong></span>
      <button type="button" id="playCutBtn" style="background:#3a3a3c; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">
        カット範囲をプレビュー
      </button>
    </div>

    <!-- 3. 出力フォーマット＆サイズ自動最適化の設定 -->
    <div class="options-grid">
      <div class="option-item">
        <label for="formatSelect">変換モード</label>
        <select id="formatSelect">
          <option value="mp3">MP3 (画面録画/動画から音声のみ抽出)</option>
          <option value="mp4">MP4 (軽量動画化)</option>
        </select>
      </div>

      <div class="option-item">
        <label for="targetSizeInput">目標の上限ファイルサイズ (KB)</label>
        <input type="number" id="targetSizeInput" value="800" min="50" step="50">
      </div>
    </div>

    <button id="processBtn" class="btn">最適化して変換・カット実行</button>

    <!-- プログレス表示 -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
      <div class="status-text" id="statusText">エンジン初期化中...</div>
    </div>

    <!-- 変換結果 -->
    <div class="result-section" id="resultSection">
      <h3>変換が完了しました！</h3>
      <p id="resultInfoText"></p>
      <a id="downloadLink" class="download-btn" download>ファイルを保存</a>
    </div>
  </div>
</div>

<script>
  const { createFFmpeg, fetchFile } = FFmpeg;
  const ffmpeg = createFFmpeg({ log: false });

  // DOM要素
  const fileInput = document.getElementById('fileInput');
  const previewSection = document.getElementById('previewSection');
  const videoPreview = document.getElementById('videoPreview');
  const startRange = document.getElementById('startRange');
  const endRange = document.getElementById('endRange');
  const startTimeLabel = document.getElementById('startTimeLabel');
  const endTimeLabel = document.getElementById('endTimeLabel');
  const selectedDurationLabel = document.getElementById('selectedDurationLabel');
  const playCutBtn = document.getElementById('playCutBtn');
  const formatSelect = document.getElementById('formatSelect');
  const targetSizeInput = document.getElementById('targetSizeInput');
  const processBtn = document.getElementById('processBtn');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const statusText = document.getElementById('statusText');
  const resultSection = document.getElementById('resultSection');
  const resultInfoText = document.getElementById('resultInfoText');
  const downloadLink = document.getElementById('downloadLink');

  let currentFile = null;
  let totalDuration = 0;
  let startTime = 0;
  let endTime = 0;

  function formatTime(sec) {
    const mins = Math.floor(sec / 60);
    const secs = (sec % 60).toFixed(1);
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    currentFile = file;
    const url = URL.createObjectURL(file);
    videoPreview.src = url;
    previewSection.style.display = 'block';
    resultSection.style.display = 'none';
  });

  videoPreview.addEventListener('loadedmetadata', () => {
    totalDuration = videoPreview.duration;
    
    startRange.max = totalDuration;
    endRange.max = totalDuration;
    
    startRange.value = 0;
    endRange.value = totalDuration;

    updateUI();
  });

  function updateUI() {
    startTime = parseFloat(startRange.value);
    endTime = parseFloat(endRange.value);

    if (startTime >= endTime) {
      startTime = Math.max(0, endTime - 0.1);
      startRange.value = startTime;
    }

    startTimeLabel.textContent = formatTime(startTime);
    endTimeLabel.textContent = formatTime(endTime);
    selectedDurationLabel.textContent = formatTime(endTime - startTime);
  }

  startRange.addEventListener('input', () => {
    updateUI();
    videoPreview.currentTime = startTime;
  });

  endRange.addEventListener('input', () => {
    updateUI();
    videoPreview.currentTime = endTime;
  });

  playCutBtn.addEventListener('click', () => {
    videoPreview.currentTime = startTime;
    videoPreview.play();
  });

  videoPreview.addEventListener('timeupdate', () => {
    if (videoPreview.currentTime >= endTime) {
      videoPreview.pause();
      videoPreview.currentTime = startTime;
    }
  });

  // 変換・カット・MP3抽出・軽量化実行
  processBtn.addEventListener('click', async () => {
    if (!currentFile) return;

    const duration = endTime - startTime;
    if (duration <= 0) {
      alert('有効なカット時間を指定してください。');
      return;
    }

    const targetSizeKB = parseFloat(targetSizeInput.value) || 800;
    const targetFormat = formatSelect.value;

    processBtn.disabled = true;
    progressContainer.style.display = 'block';
    resultSection.style.display = 'none';
    progressBar.style.width = '0%';
    statusText.textContent = 'FFmpegエンジン起動中...';

    try {
      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }

      ffmpeg.setProgress(({ ratio }) => {
        const percent = Math.min(Math.round(ratio * 100), 100);
        if (!isNaN(percent)) {
          progressBar.style.width = percent + '%';
          statusText.textContent = `変換中... ${percent}%`;
        }
      });

      // 拡張子維持（画面録画の.movにも完全対応）
      const fileExt = currentFile.name.split('.').pop().toLowerCase() || 'mp4';
      const inputName = `input_${Date.now()}.${fileExt}`;
      const outputName = `output_${Date.now()}.${targetFormat}`;

      ffmpeg.FS('writeFile', inputName, await fetchFile(currentFile));

      // 800KB以下など目標サイズ達成のためのビットレート算出
      const targetBits = targetSizeKB * 1024 * 8;
      const totalTargetBitrateKbps = Math.floor((targetBits / duration) / 1024);

      let ffmpegArgs = [];

      // 高速カットのための時間指定
      ffmpegArgs.push('-ss', startTime.toString());
      ffmpegArgs.push('-i', inputName);
      ffmpegArgs.push('-t', duration.toString());

      if (targetFormat === 'mp3') {
        // 【画面録画のMP3変換修正ポイント】
        // 映像トラックを除外(-vn)し、明示的にLAME MP3エンコーダ(-c:a libmp3lame)で変換
        const audioBitrate = Math.max(32, Math.min(320, totalTargetBitrateKbps));
        ffmpegArgs.push('-vn'); 
        ffmpegArgs.push('-c:a', 'libmp3lame');
        ffmpegArgs.push('-b:a', `${audioBitrate}k`);
        ffmpegArgs.push('-ar', '44100'); // 標準的なサンプリング周波数に固定
      } else if (targetFormat === 'mp4') {
        // 動画圧縮モード
        const audioBitrate = 64;
        let videoBitrate = totalTargetBitrateKbps - audioBitrate;
        if (videoBitrate < 40) videoBitrate = 40;

        ffmpegArgs.push('-c:v', 'libx264');
        ffmpegArgs.push('-b:v', `${videoBitrate}k`);
        ffmpegArgs.push('-vf', 'scale=-2:min(480\\,ih)'); // 最短時間処理のため解像度自動調整
        ffmpegArgs.push('-c:a', 'aac');
        ffmpegArgs.push('-b:a', `${audioBitrate}k`);
        ffmpegArgs.push('-preset', 'ultrafast');
      }

      ffmpegArgs.push(outputName);

      statusText.textContent = 'エンコード・サイズ調整中...';
      await ffmpeg.run(...ffmpegArgs);

      const data = ffmpeg.FS('readFile', outputName);
      const mimeType = targetFormat === 'mp3' ? 'audio/mp3' : 'video/mp4';
      const blob = new Blob([data.buffer], { type: mimeType });
      const actualSizeKB = (blob.size / 1024).toFixed(1);

      // クリーニング
      ffmpeg.FS('unlink', inputName);
      ffmpeg.FS('unlink', outputName);

      const downloadUrl = URL.createObjectURL(blob);
      downloadLink.href = downloadUrl;
      downloadLink.download = `output_${Date.now()}.${targetFormat}`;
      
      resultInfoText.textContent = `出力サイズ: ${actualSizeKB} KB / 再生時間: ${duration.toFixed(1)} 秒`;
      resultSection.style.display = 'block';
      statusText.textContent = '処理が正常に終了しました！';

    } catch (err) {
      console.error(err);
      alert('変換に失敗しました。ファイル形式または選択時間を確認してください。');
      statusText.textContent = 'エラーが発生しました。';
    } finally {
      processBtn.disabled = false;
    }
  });
</script>

</body>
</html>
